# Teaching. This one file feeds two places: the Teaching tab, and the Teaching
# section of the CV tab. Add here and it appears in both.
#
#   group      the subheading it sits under in the Teaching tab
#   highlight  true for what you are teaching now - shown in a box at the top
#   when       left-hand column (term, year or range)
#   what       bold title
#   where      small right-aligned note
#   detail     the paragraph underneath (optional)
#   cv         set to false to keep an entry off the CV tab, when the printed
#              CV should stay as it is
#   codes      course codes with links, for the entries in the box at the top.
#              A course given jointly by GU and Chalmers has one code each and
#              both are listed.


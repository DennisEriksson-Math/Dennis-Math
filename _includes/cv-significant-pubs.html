{% assign significant_pubs = site.data.projects | where_exp: "e", "e.significant == true" | sort: "year" | reverse %}
{% if significant_pubs.size > 0 %}
<div class="cv-block cv-significant-block">
  <h3 class="cv-heading"><span class="cv-accent">Sel</span>ect Significant Publications</h3>
  {% for p in significant_pubs %}
  {% include cv-publication-entry.html pub=p %}
  {% endfor %}
</div>
{% endif %}

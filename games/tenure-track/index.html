<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2b1a0e">
<title>Tenure Track</title>
<meta name="description" content="Six years, three columns, and never enough hours to feed all of them. Survive to the vote.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Sora:wght@300;400;500;600&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game.css?v=1">
</head>
<body>

<div class="desk" aria-hidden="true"><div class="vignette"></div><div class="grain"></div></div>

<main class="file">
  <header class="file-head">
    <div>
      <div class="file-kicker">Personnel file · Confidential</div>
      <h1 class="file-title">Tenure Track</h1>
    </div>
    <div class="file-term">
      <b id="term">Year 1 · Autumn</b>
      <span id="remaining-terms">12 semesters remain</span>
    </div>
  </header>

  <section class="meters" id="meters"></section>

  <section class="alloc">
    <div class="alloc-head">
      <h2>Where do the hours go?</h2>
      <div class="alloc-left"><b id="left">8</b><span>hours unassigned</span></div>
    </div>
    <div class="alloc-rows" id="alloc"></div>
    <button class="btn" id="submit" type="button">File the semester</button>
  </section>

  <footer class="file-foot">
    <span id="ledger">Appointed. The clock starts now.</span>
    <a class="back" href="../">← Back to the Common Room</a>
  </footer>
</main>

<div class="overlay" id="overlay"></div>

<script src="sfx.js?v=1"></script>
<script src="game.js?v=2"></script>
</body>
</html>

    <p> Department&nbsp;of&nbsp;Mathematical&nbsp;Sciences •  Chalmers&nbsp;University&nbsp;of&nbsp;Technology and the&nbsp;University&nbsp;of&nbsp;Gothenburg  •  412&nbsp;58&nbsp;Gothenburg,&nbsp;Sweden • dener [&#x430;t] chalmers.se • he/him/his • Please call me Dennis"
display_header_contact_info: "true"

resume_header_intro: "<p>I am a Professor in Mathematics at Chalmers University of Technology and the University of Gothenburg.</p>
<p> My work centers on Arithmetic and Complex Algebraic Geometry, focusing on Arakelov
theory, singularity invariants, and connections to enumerative mirror symmetry.
A primary contribution is the development of intersection theoretic methods in
Arakelov geometry, including foundational work on the Deligne-Riemann-Roch iso-
morphism and BCOV invariants of Calabi–Yau manifolds. A recurring theme is understanding how analytic, arithmetic, and algebro-geometric structures reflect one another.

Future research will focus on applications of these techniques to open questions in
the theory of singularities, related questions about moduli spaces, and enumerative
geometry.  </p>
<p>This page provides access to my research publications and related academic information.</p>"


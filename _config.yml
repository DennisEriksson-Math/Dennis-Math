resume_header_intro: "<p><a href='./pendulum.html'>Play with maths!</a></p>
<p>I study the solutions to equations and inequalities in whole numbers. These are called Diophantine problems and they’re part of number theory. I use “analytic” arguments which are often fairly elementary, which makes it analytic number theory.</p>
<p>I’ve become interested in something which seems very different: nonlinear dispersive partial differential equations (nonlinear dispersive PDEs). This is a type of mathematical model which describes physical systems from ocean waves to fibre optic cables.</p>
<p>Some <a href='https://www.dropbox.com/s/qp0p2wvcyebmw7m/document.pdf?raw=1'>slides</a> about the circle method for forms in rather few variables, in the style of Tran and Wang.</p>"



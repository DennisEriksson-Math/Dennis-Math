# Site settings
url: "https://denniseriksson-math.github.io" # Your live site URL (domain only)
baseurl: "/Dennis-Math" # Subfolder the site is served from
title: "Dennis Eriksson"
tagline: "Personal Page"
description: "Publications, research interests, and information about my work in arithmetic, algebraic and complex geometry at Chalmers University of Technology and the University of Gothenburg."
author:
  name: Dennis Eriksson
  alternateName:
    - Dennis
    - Dennis Eriksson
  url: "https://www.chalmers.se/en/persons/dener/" # your page at Chalmers
  givenName: Dennis
  additionalName:
  familyName:
    - Eriksson
  twitter:
twitter:
  card: summary
# Accounts search engines should associate with you. Only list pages that
# resolve - a dead entry here tells Google about somebody who does not exist.
social:
  name: Dennis Eriksson
  links:
    - https://www.chalmers.se/en/persons/dener/
    - https://orcid.org/0000-0003-0646-6613
locale: en_GB

# Local-only helpers - never part of the published site
exclude:
  - Gemfile
  - Gemfile.lock
  - .bundle
  - _assets
  - "*.command"
  - "Publish Webpage.app"
  - "Update Webpage.app"
  - "Preview Webpage.app"

# Build settings (No changes needed here)
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Resume settings
resume_avatar: "true"
resume_name: "Dennis Eriksson"
resume_title: "Professor in Mathematics"

# used for the contact button in _layouts/resume.html
resume_contact_email: "dener [&#x430;t] chalmers.se"

# the next two items are used for schema itemprops in _layouts/resume.html
# resume_contact_telephone:
resume_contact_address: "Department of Mathematical Sciences, Chalmers University of Technology and the University of Gothenburg, Chalmers tvärgata 3, 412 58 Gothenburg, Sweden"

resume_header_contact_info: "<span itemprop='knowsAbout'>Algebraic geometry</span> • <span itemprop='knowsAbout'>Arakelov theory</span> • <span itemprop='knowsAbout'>Complex geometry</span> • <span itemprop='knowsAbout'>AI for mathematics</span></p>
    <p> Department&nbsp;of&nbsp;Mathematical&nbsp;Sciences •  Chalmers&nbsp;University&nbsp;of&nbsp;Technology and the&nbsp;University&nbsp;of&nbsp;Gothenburg  •  412&nbsp;58&nbsp;Gothenburg,&nbsp;Sweden • dener [&#x430;t] chalmers.se • he/him/his • Please call me Dennis"
display_header_contact_info: "true"

resume_header_intro: "<ul>
      <li>I think a lot about invariants in arithmetic and complex geometry.</li>
      <li>Lately: genus one mirror symmetry, BCOV invariants, hypersurface singularities,
      arithmetic analogues.</li>
      <li>Also curious about what AI can and cannot do in mathematics.</li>
      <li>I take master students.</li>
    </ul>"


# Publications
#
# Fields
#   project        title, as it should appear
#   id             short unique tag, used as the #anchor for linking to one paper
#   coauthor-list  keys from _data/coauthors.yml; leave out entirely for solo papers
#   status         submitted | accepted | published   <- drives the filter buttons
#   journal        journal name (leave out for a plain preprint)
#   arxiv          arXiv identifier only, e.g. 2509.05077  (NOT the full URL)
#   doi            DOI only, e.g. 10.5802/jep.254          (NOT the full URL)
#   note           anything extra to print after the year
#
# Both arxiv: and doi: are optional, and both are shown when present.

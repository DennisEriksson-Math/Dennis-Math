updated: "7 December 2025"

summary: >
  My research grows out of arithmetic geometry, where algebraic geometry, number theory,
  and complex analysis meet. This area combines tools from Grothendieck's algebraic
  geometry with ideas from complex differential geometry, and I use this interaction to
  study structural invariants of algebraic varieties. In recent years, these methods have
  naturally connected my work to mathematical aspects of mirror symmetry — a conjectural
  framework originating in string theory that continues to influence several areas of
  modern geometry — as well as to questions about singularities. Across these topics, my
  work studies how algebraic geometry, and in particular intersection theory, serves as a
  meeting point for arithmetic ideas, complex geometric methods, Hodge theory,
  singularities, and mirror symmetry.

about: >
  I am a Swedish mathematician with extensive international research experience, and a
  strong interest in collaboration, communication and education. Outside mathematics,
  I enjoy language learning and cultural travel.


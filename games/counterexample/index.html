<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e2e28">
<title>Counterexample</title>
<meta name="description" content="A conjecture, a grid of candidates, and exactly one thing that breaks it. Find it before the timer does.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Sora:wght@300;400;500;600&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game.css?v=2">
</head>
<body>

<div class="slate" aria-hidden="true">
  <div class="smudge smudge-1"></div>
  <div class="smudge smudge-2"></div>
  <div class="smudge smudge-3"></div>
  <div class="dust"></div>
</div>

<header class="hud">
  <div class="hud-row">
    <div class="stat"><b id="score">0</b><span>Score</span></div>
    <div class="stat"><b id="round">1</b><span>Round</span></div>
    <div class="stat"><b id="best">0</b><span>Best</span></div>
    <div class="errata" id="errata" title="Errata">
      <span>Errata</span>
      <i></i><i></i><i></i>
    </div>
  </div>
  <div class="timer"><div class="timer-fill" id="timer-fill"></div></div>
</header>

<main class="stage">
  <p class="claim" id="claim"></p>
  <div class="grid" id="grid"></div>
  <p class="verdict" id="verdict"></p>
</main>

<div class="tray" aria-hidden="true"><i class="chalk"></i><i class="chalk chalk-b"></i><i class="eraser"></i></div>

<div class="overlay" id="overlay"></div>

<script src="sfx.js?v=1"></script>
<script src="game.js?v=3"></script>
</body>
</html>

resume_header_contact_info:    "<span itemprop='knowsAbout'>Non-Archimedean Geometry</span> • <span itemprop='knowsAbout'>Complex Analysis</span> • <span itemprop='worksFor'>Chalmers&nbsp;University</span></p>
    <p> Department&nbsp;of&nbsp;Mathematical&nbsp;Sciences •  Chalmers&nbsp;University&nbsp;of&nbsp;Technology and the&nbsp;University&nbsp;of&nbsp;Gothenburg  •  412&nbsp;96&nbsp;Gothenburg,&nbsp;Sweden • dennis [&#x430;t] chalmers.se • he/him/his • Please call me Dennis"
display_header_contact_info:   "true"

resume_header_intro: "<p>I am a Professor in Mathematics at Chalmers University of Technology and the University of Gothenburg.</p>
<p>My research focuses on **non-Archimedean geometry**, **complex analysis**, and their connections to **arithmetic geometry** and **Hodge theory**. I study topics such as the geometry of non-Archimedean spaces, degenerations of complex structures, and the associated analytic and algebraic invariants.</p>
<p>This page provides access to my research publications and related academic information.</p>"


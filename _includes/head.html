<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="{{ '/scripts/animate-icon-links.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>  

  <!--<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>-->

  <!-- Google font typography settings - defined in _config.yml -->
  {% if site.resume_theme == 'default' %}
  <link href='https://fonts.googleapis.com/css?family=Lora:400,700|Open+Sans:300,400,600,700,800' rel='stylesheet' type='text/css'>
  {% endif %}

  <!--<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">-->

  <!-- Every asset carries the build time, so a browser can never pair new
       markup with a stylesheet it cached ten minutes ago. GitHub Pages serves
       assets with cache-control: max-age=600, which otherwise guarantees that
       mismatch for anyone who visited shortly before an update. -->
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <!--<link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">-->
  <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}?v={{ site.time | date: '%s' }}" />

  <!-- PWA: installable app shell -->
  <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
  <meta name="theme-color" content="#3f7d5a">
  <link rel="apple-touch-icon" href="{{ '/images/icons/apple-touch-icon.png' | relative_url }}">
  <script src="{{ '/scripts/install-prompt.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('{{ '/sw.js' | relative_url }}');
      });
    }
  </script>

  {% seo %}
</head>

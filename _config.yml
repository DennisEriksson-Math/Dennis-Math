# Background behind the page. One of:
#   random   - one of the below, chosen afresh on each visit
#              (bubbles 40%, lattice 40%, nothing 20%)
#   bubbles  - soft translucent discs drifting slowly upward
#   lattice  - a faint period lattice creeping diagonally
#   none     - nothing, ever
# Visitors can switch it off for themselves with the control in the footer,
# and it never animates for anyone who has asked for reduced motion.
resume_background: random

